<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار الصف الخامس الابتدائي - تكنولوجيا المعلومات والاتصالات | منصة محترف</title>
<style>
:root{--blue:#0d4a86;--orange:#f39c12;--green:#1faa59;--red:#e74c3c;--ink:#12263f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:"Segoe UI",Tahoma,"Cairo","Noto Naskh Arabic",Arial,sans-serif;color:var(--ink)}
body{background:linear-gradient(135deg,#0d4a86,#2a7de1,#7b4be0,#f39c12);background-size:400% 400%;animation:bg 18s ease infinite;min-height:100vh;overflow-x:hidden}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.float{position:fixed;font-size:38px;opacity:.25;animation:fl linear infinite;pointer-events:none;z-index:0;bottom:-60px}
@keyframes fl{to{transform:translateY(-115vh) rotate(360deg)}}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:26px;padding:24px;box-shadow:0 14px 40px rgba(0,0,0,.28);animation:pop .5s ease}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.logo{display:block;margin:0 auto;width:150px;max-width:40vw;animation:bounce 3s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-8px)}}
h1{text-align:center;font-size:30px;margin:8px 0;color:var(--blue)}
h2{text-align:center;font-size:24px;margin:6px 0 16px;color:var(--blue)}
p.sub{text-align:center;font-size:20px;margin:4px 0 18px}
input.name{width:100%;font-size:26px;padding:16px;border:4px solid #cfe0f5;border-radius:18px;text-align:center;font-family:inherit;outline:none}
input.name:focus{border-color:var(--orange)}
.btn{display:block;width:100%;font-family:inherit;font-size:24px;font-weight:800;padding:16px 18px;margin:12px 0;border:none;border-radius:18px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--blue),#2a7de1);box-shadow:0 6px 0 rgba(0,0,0,.2);transition:transform .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn.or{background:linear-gradient(135deg,#f39c12,#ff7a18)}
.btn.gr{background:linear-gradient(135deg,#1faa59,#2ecc71)}
.btn.wa{background:linear-gradient(135deg,#128c4a,#25d366)}
.btn.gray{background:linear-gradient(135deg,#607d8b,#90a4ae)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:19px;font-weight:700;margin-bottom:8px;flex-wrap:wrap}
.pill{background:#eaf2fd;border-radius:999px;padding:6px 14px;color:var(--blue)}
.bar{height:16px;background:#e3ecf7;border-radius:99px;overflow:hidden;margin:8px 0 16px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--green));transition:width .5s;border-radius:99px}
.qnum{font-size:19px;color:#6b7b90;font-weight:700}
.qtext{font-size:27px;font-weight:800;line-height:1.7;margin:8px 0 18px;color:var(--ink)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:start;font-family:inherit;font-size:24px;font-weight:700;padding:14px 16px;margin:10px 0;background:#f4f8fe;border:4px solid #cfe0f5;border-radius:18px;cursor:pointer;color:var(--ink);transition:.15s}
.opt:hover:not(:disabled){background:#fff6e5;border-color:var(--orange);transform:scale(1.015)}
.opt .lb{min-width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
.opt.ok{background:#d9f7e5;border-color:var(--green);animation:okp .6s}
.opt.ok .lb{background:var(--green)}
.opt.no{background:#fde0dd;border-color:var(--red);animation:shake .5s}
.opt.no .lb{background:var(--red)}
.opt:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tf .opt{justify-content:center;font-size:30px;padding:22px 10px}
@keyframes okp{50%{transform:scale(1.05)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.fb{display:none;margin-top:14px;padding:16px;border-radius:18px;font-size:24px;font-weight:800;text-align:center}
.fb.ok{display:block;background:#d9f7e5;color:#0b6b35;animation:pop .4s}
.fb.no{display:block;background:#fde0dd;color:#a5281b;animation:pop .4s}
.fb .em{font-size:64px;display:block;animation:bounce 1s infinite}
.big{font-size:90px;text-align:center;animation:bounce 2s infinite}
.score{font-size:60px;font-weight:900;text-align:center;color:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:20px;margin:12px 0}
td,th{padding:10px;border-bottom:2px solid #e3ecf7;text-align:center}
th{background:#eaf2fd;color:var(--blue)}
.confetti{position:fixed;top:-50px;font-size:34px;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
.flash{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0}
.flash.g{background:radial-gradient(circle,rgba(46,204,113,.5),transparent 70%);animation:fh .7s}
.flash.r{background:radial-gradient(circle,rgba(231,76,60,.5),transparent 70%);animation:fh .7s}
@keyframes fh{0%{opacity:1}100%{opacity:0}}
.foot{text-align:center;color:#fff;font-weight:700;margin:14px 0;font-size:16px}
@media(max-width:520px){.qtext{font-size:23px}.opt{font-size:21px}h1{font-size:25px}}
</style>
</head>

{t:"m",q:"المكان الرئيسي لحفظ الملفات داخل الحاسب الآلي ......",o:["الكاميرا","القرص الصلب","الميكروفون","الشاشة"],a:1},

{t:"m",q:"لإنشاء مجلد جديد نستخدم الأمر ......",o:["New","And","Open","Save"],a:0},

/* ---------- Sounds ---------- */
let AC=null;
function ctx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function tone(f,t0,d,type="sine",v=.25){const a=ctx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime+t0);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t0+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d)}
function sndOk(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.25,"triangle"))}
function sndNo(){tone(220,0,.25,"sawtooth",.2);tone(160,.2,.4,"sawtooth",.2)}
function sndWin(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.12,.3,"triangle"))}
function sndClick(){tone(700,0,.06,"square",.08)}

/* ---------- Effects ---------- */
function confetti(list,n){for(let i=0;i<n;i++){const s=document.createElement("span");s.className="confetti";s.textContent=list[Math.floor(Math.random()*list.length)];s.style.left=Math.random()*100+"vw";s.style.animationDuration=(2+Math.random()*2.5)+"s";s.style.fontSize=(24+Math.random()*26)+"px";document.body.appendChild(s);setTimeout(()=>s.remove(),5000)}}
function flash(c){const f=document.getElementById("flash");f.className="flash";void f.offsetWidth;f.className="flash "+c}
(function bg(){const ic=["💻","📶","🖱️","⌨️","💾","🌐","📁","🖨️","📱","🔌","🧠","⭐"];const d=document.getElementById("bgicons");for(let i=0;i<16;i++){const s=document.createElement("span");s.className="float";s.textContent=ic[i%ic.length];s.style.left=(Math.random()*95)+"vw";s.style.animationDuration=(14+Math.random()*16)+"s";s.style.animationDelay=(-Math.random()*20)+"s";d.appendChild(s)}})();

/* ---------- App ---------- */
const app=document.getElementById("app");
let S={name:"",qs:[],i:0,score:0,per:[],done:false,mode:"all"};
const $=(h)=>{app.innerHTML=h};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function welcome(){
$(`<div class="card">
<img class="logo" src="${LOGO}" alt="منصة محترف">
<h1>🎓 اختبار تكنولوجيا المعلومات والاتصالات 🎓</h1>
<p class="sub">الصف الخامس الابتدائي – الوحدة الأولى (الدروس من 1 إلى 5)</p>
<p class="sub" style="font-weight:800">✍️ اكتب اسمك أولاً ثم ابدأ الاختبار</p>
<input class="name" id="nm" placeholder="اكتب اسمك هنا..." maxlength="40" autocomplete="off">
<button class="btn or" id="go">🚀 ابدأ الآن</button>
</div>`);
const nm=document.getElementById("nm");nm.value=S.name;
const go=()=>{const v=nm.value.trim();if(!v){nm.style.borderColor="#e74c3c";nm.placeholder="⚠️ من فضلك اكتب اسمك";sndNo();return}S.name=v;sndClick();ctx();menu()};
document.getElementById("go").onclick=go;nm.onkeydown=e=>{if(e.key==="Enter")go()};
}

function menu(){
let b="";
L.forEach((l,i)=>{b+=`<button class="btn ${i%2?'or':''}" onclick="start(${i})">${l.icon} ${esc(l.short)} – 10 أسئلة</button>`});
$(`<div class="card">
<img class="logo" src="${LOGO}" alt="منصة محترف" style="width:110px">
<h2>أهلاً بك يا ${esc(S.name)} 👋</h2>
<p class="sub">اختر ما تريد:</p>
<button class="btn gr" onclick="start(null)">🏆 الاختبار الشامل (50 سؤالاً – الدروس الخمسة)</button>
${b}
<button class="btn gray" onclick="welcome()">✏️ تغيير الاسم</button>
</div>`);
}

function start(li){
S.mode=li;S.qs=[];S.i=0;S.score=0;S.done=false;S.per=L.map(()=>({c:0,t:0}));
const idx=li===null?[0,1,2,3,4]:[li];
idx.forEach(k=>L[k].qs.forEach(q=>S.qs.push({...q,li:k})));
sndClick();show();
}

function show(){
const q=S.qs[S.i],l=L[q.li],en=false,dir="rtl";
const inLesson=S.qs.filter(x=>x.li===q.li);const n=inLesson.indexOf(q)+1;
let opts="";
if(q.t==="m"){
opts=q.o.map((o,k)=>`<button class="opt" dir="${dir}" onclick="ans(${k})"><span class="lb">${l.labs[k]}</span><span>${esc(o)}</span></button>`).join("");
}else{
opts=`<div class="tf"><button class="opt" onclick="ans(true)" style="justify-content:center">${en?"True ✅":"صح ✅"}</button><button class="opt" onclick="ans(false)" style="justify-content:center">${en?"False ❌":"خطأ ❌"}</button></div>`;
}
$(`<div class="card">
<div class="top"><span class="pill">👤 ${esc(S.name)}</span><span class="pill">${l.icon} ${esc(l.short)}</span><span class="pill">⭐ ${S.score}</span></div>
<div class="bar"><i style="width:${(S.i/S.qs.length)*100}%"></i></div>
<div class="qnum">سؤال ${n} من 10 &nbsp;|&nbsp; ${q.t==="m"?(en?"Choose the correct answer":"اختر الإجابة الصحيحة"):(en?"Put (✓) or (✗)":"ضع علامة (✓) أو (✗)")}</div>
<div class="qtext" dir="${dir}" style="text-align:${en?'left':'right'}">${esc(q.q)}</div>
<div id="opts">${opts}</div>
<div class="fb" id="fb"></div>
<button class="btn or" id="next" style="display:none" onclick="next()">${S.i===S.qs.length-1?"🏁 عرض النتيجة":"السؤال التالي ➡️"}</button>
</div>`);
window.scrollTo({top:0,behavior:"smooth"});
}

function ans(v){
const q=S.qs[S.i],l=L[q.li],en=false;
const ok=(q.t==="m")?(v===q.a):(v===q.a);
const btns=[...document.querySelectorAll("#opts .opt")];
btns.forEach(b=>b.disabled=true);
let corrIdx=q.t==="m"?q.a:(q.a?0:1),chosenIdx=q.t==="m"?v:(v?0:1);
btns[corrIdx].classList.add("ok");
if(!ok)btns[chosenIdx].classList.add("no");
S.per[q.li].t++;
const fb=document.getElementById("fb");
if(ok){
S.score++;S.per[q.li].c++;sndOk();flash("g");
confetti(["🎉","⭐","🌟","👏","🥳","✨","😍"],28);
const msgs=en?["Excellent! 🎉 أحسنت","Great job! 🌟 ممتاز","Correct! 👏 إجابة صحيحة"]:["أحسنت! إجابة صحيحة 🎉","ممتاز يا بطل! 🌟","رائع! إجابة صحيحة 👏"];
fb.className="fb ok";fb.innerHTML=`<span class="em">😄</span>${msgs[Math.floor(Math.random()*msgs.length)]}`;
}else{
sndNo();flash("r");
confetti(["😢","💔","😞","❌"],12);
let right=q.t==="m"?q.o[q.a]:(q.a?(en?"True":"صح"):(en?"False":"خطأ"));
fb.className="fb no";fb.innerHTML=`<span class="em">😢</span>${en?"Wrong answer – ":""}إجابة خاطئة<br><span style="font-size:21px">${en?"The correct answer is":"الإجابة الصحيحة"}: <b dir="${en?'ltr':'rtl'}">${esc(right)}</b></span>`;
}
document.getElementById("next").style.display="block";
document.getElementById("next").scrollIntoView({behavior:"smooth",block:"center"});
}

function next(){sndClick();S.i++;if(S.i>=S.qs.length)result();else show()}

function msgFor(p){
if(p>=90)return["🏆","ممتاز جداً! أنت بطل محترف 🌟"];
if(p>=75)return["🥇","جيد جداً! استمر 👏"];
if(p>=50)return["🙂","جيد، راجع الدروس وحاول مرة أخرى 📚"];
return["💪","لا تيأس! راجع الدروس وحاول مرة أخرى 📖"];
}

function result(){
const tot=S.qs.length,p=Math.round(S.score/tot*100),[em,ms]=msgFor(p);
sndWin();confetti(["🎉","🏆","⭐","🎊","🥳","🌟"],60);
let rows=S.per.map((r,i)=>r.t?`<tr><td>${esc(L[i].short)}</td><td>${r.c} / ${r.t}</td></tr>`:"").join("");
$(`<div class="card">
<img class="logo" src="${LOGO}" alt="منصة محترف" style="width:110px">
<div class="big">${em}</div>
<h2>انتهى الاختبار يا ${esc(S.name)}!</h2>
<div class="score">${S.score} / ${tot}</div>
<p class="sub" style="font-size:26px;font-weight:800">${p}% – ${ms}</p>
<table><tr><th>الدرس</th><th>الدرجة</th></tr>${rows}</table>
<button class="btn wa" onclick="sendWA()">📲 إرسال النتيجة على واتساب</button>
<button class="btn or" onclick="start(S.mode)">🔄 إعادة الاختبار</button>
<button class="btn gray" onclick="menu()">🏠 القائمة الرئيسية</button>
</div>`);
}

function sendWA(){
const tot=S.qs.length,p=Math.round(S.score/tot*100);
const d=new Date().toLocaleString("ar-EG");
let t=`🎓 *منصة محترف – Mohtarf by a2zlearn*\n`;
t+=`📘 اختبار تكنولوجيا المعلومات والاتصالات – الصف الخامس الابتدائي\n`;
t+=`👤 الاسم: ${S.name}\n`;
S.per.forEach((r,i)=>{if(r.t)t+=`${L[i].icon} ${L[i].short}: ${r.c}/${r.t}\n`});
t+=`⭐ *النتيجة النهائية: ${S.score} من ${tot} (${p}%)*\n📅 ${d}`;
window.open("https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(t),"_blank");
}

welcome();
</script>
</body>
</html>
